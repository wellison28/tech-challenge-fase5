name: sales-service

on:
  push:
    branches: [main]
    paths:
      - 'sales-service/**'
      - '.github/workflows/sales-service.yml'
  pull_request:
    paths:
      - 'sales-service/**'
      - '.github/workflows/sales-service.yml'
  # Permite disparar manualmente, para revalidar sem alterar código.
  workflow_dispatch:

# Todos os comandos rodam dentro da pasta do serviço: no monorepo, o checkout
# traz a raiz do repositório, e sem isto o npm não encontraria o package.json.
defaults:
  run:
    working-directory: sales-service

# Cancela execuções antigas do mesmo branch: economiza runner e dá feedback
# mais rápido no PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revenda
          POSTGRES_PASSWORD: revenda
          POSTGRES_DB: sales
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://revenda:revenda@localhost:5432/sales?schema=public
      AUTH_MODE: dev
      JWT_DEV_SECRET: ci-only-secret
      NODE_ENV: test
      SAGA_MODE: inline
      PAYMENT_PROVIDER: fake
      PAYMENT_WEBHOOK_SECRET: segredo-de-webhook-de-ci
      VEHICLE_SERVICE_URL: http://localhost:3001
      CUSTOMER_SERVICE_URL: http://localhost:3002

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sales-service/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck

      - run: npx prisma migrate deploy
      - run: npm test

      # Falha em vulnerabilidade alta ou crítica nas dependências deste serviço.
      - run: npm audit --audit-level=high

      - name: Publica o relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-sales-service
          path: sales-service/coverage/

  build:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: ./sales-service
          push: false
          tags: sales-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
